# Publish kipp-memory to PyPI when a v* tag is pushed.
#
# Trusted Publishing (OIDC): no PyPI token is stored anywhere. PyPI trusts
# this repo + workflow file + the `pypi` environment, which only v* tags
# may deploy to. Release steps are in docs/releasing.md.
#
# Actions are pinned to commit SHAs; the comment names the release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tag matches the pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      # Upload straight after building, before any other third-party code
      # runs here, so nothing installed later can alter what gets published.
      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Check and test the artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Metadata check
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      # Test the wheel that will be uploaded, not the source tree. CPU-only
      # torch first, from its own index, so the sentence-transformers
      # dependency doesn't pull the multi-GB CUDA build from PyPI. This job
      # can't change what's published: publish downloads build's artifact.
      - name: Test the built wheel
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl pytest
          python -m pytest -q

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kipp-memory/
    permissions:
      id-token: write # OIDC token for Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
