[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kipp-memory"
version = "0.1.0"
description = "Entity-based persistent memory with semantic search for AI agents"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.0",
    "click>=8.0",
    "httpx>=0.25",  # direct use in backup.py (snapshot download); also transitive via qdrant-client
    "numpy>=1.24",
    "mcp>=1.0,<2",  # FastMCP import path removed in SDK 2.x (#29)
]

[project.scripts]
kipp = "kipp.cli:main"
memory = "kipp.cli:main"  # pre-rename alias; Endurance and OpenClaw call it

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
